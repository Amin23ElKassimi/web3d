[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# SPA fallback (le funzioni su /api/* hanno la precedenza)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
